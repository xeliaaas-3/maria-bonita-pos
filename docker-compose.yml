services:
  postgres:
    image: postgres:16-alpine
    container_name: boutique_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: boutique
      POSTGRES_PASSWORD: boutique123
      POSTGRES_DB: boutique_pos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - boutique_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boutique -d boutique_pos"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: boutique_redis
    restart: unless-stopped
    networks:
      - boutique_net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: boutique_backend
    restart: on-failure
    environment:
      DATABASE_URL: postgresql://boutique:boutique123@postgres:5432/boutique_pos
      REDIS_URL: redis://redis:6379
      JWT_SECRET: boutique_super_secret_jwt_key_para_desarrollo_local_2024
      JWT_REFRESH_SECRET: boutique_refresh_secret_key_desarrollo_local_diferente_2024
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      NODE_ENV: development
      PORT: 4000
      SOCKET_CORS_ORIGIN: http://localhost:3000
      APP_URL: http://localhost:4000
      UPLOAD_DIR: ./uploads
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    networks:
      - boutique_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: boutique_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - boutique_net

volumes:
  postgres_data:
  redis_data:
  uploads:
  logs:

networks:
  boutique_net:
    driver: bridge
